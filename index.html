<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shoply — Plataforma SaaS multi-tienda de comercio electrónico: crea tu tienda online con catálogo, pedidos, WhatsApp, delivery y pagos." />
  <meta property="og:title" content="Shoply — Crea tu tienda online en minutos" />
  <meta property="og:description" content="Plataforma SaaS multi-tienda: cada tienda con su diseño, catálogo, pedidos, WhatsApp y pagos." />
  <meta property="og:type" content="website" />
  <title>Shoply — Plataforma de tiendas online</title>
</head>


<body>
  <div id="root"></div>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      var div = document.createElement('div');
      div.style.color = 'red';
      div.style.padding = '20px';
      div.style.fontSize = '12px';
      div.style.fontFamily = 'monospace';
      div.style.background = '#fff';
      div.style.position = 'fixed';
      div.style.inset = '0';
      div.style.zIndex = '9999';
      div.innerHTML = '<h3>Fatal Error</h3>' + msg + '<br>at ' + url + ':' + line + ':' + col;
      if (error && error.stack) div.innerHTML += '<pre>' + error.stack + '</pre>';
      document.body.appendChild(div);
    };
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
